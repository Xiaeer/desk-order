name: Security checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-secret-policy:
    name: Repository secret policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check paths and configuration values
        shell: pwsh
        run: ./scripts/check-secrets.ps1

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The wrapper action builds an invalid base^..head range when base is the
      # repository root commit. Install the CLI and scan all history instead.
      - name: Install Gitleaks
        shell: bash
        env:
          # v8.30.1 is intentionally skipped because of upstream false negatives:
          # https://github.com/gitleaks/gitleaks/issues/2170
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${install_dir}"

          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Scan full Git history for secrets
        shell: bash
        run: gitleaks git . --redact --no-banner --verbose --exit-code 1
